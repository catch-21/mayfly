[package]
name = "mayfly-demo"
description = "A narrated, step-by-step shopping list on a local Pubky testnet, with a live chain explorer in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mayfly-demo"
path = "src/main.rs"

[dependencies]
pubky-mayfly = { path = "../core" }
pubky-mayfly-client = { path = "../client" }
pubky-mayfly-rules = { path = "../rules" }
pubky-mayfly-watchdog = { path = "../watchdog" }
pubky-testnet.workspace = true
pubky-common.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-std", "io-util", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
