[package]
name = "pubky-mayfly-watchman"
description = "Mayfly watchman: engagement, one signed receipt per observed record in causal order, consistency flags, mirror tier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The hosted watchman service (§16.2.1 E): an `Operator` over a Pubky grant session, swept on
# a timer, with a health endpoint. The library API is unchanged by it.
[[bin]]
name = "mayfly-watchman"
path = "src/bin/mayfly-watchman/main.rs"

[dependencies]
pubky-mayfly = { path = "../core" }
pubky-mayfly-client = { path = "../client" }
pubky-common.workspace = true
pubky.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt-multi-thread", "signal", "net", "fs", "sync"] }
# Chains are polled a few at a time, each under a deadline, so one slow homeserver holds
# only its own chain.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

[dev-dependencies]
pubky-testnet.workspace = true
tempfile = "3"
# Tests implement `Store` over a wrapper that can stall one homeserver.
async-trait = "0.1"
