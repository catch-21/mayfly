[package]
name = "pubky-mayfly-client"
description = "Mayfly client: storage layout, propose/confirm/reject/mirror, SSE sync, watchman engagement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pubky-sdk"]
# `PubkyStore` and `SessionSigner` over the Pubky SDK (native). Off for the wasm build, where
# storage and signing come from JavaScript through the `Store` and `Signer` traits (§16.2.1).
pubky-sdk = ["dep:pubky", "dep:futures-util"]

[dependencies]
pubky-mayfly = { path = "../core" }
pubky-common.workspace = true
pubky = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
async-trait = "0.1"
futures-util = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[dev-dependencies]
pubky-mayfly-rules = { path = "../rules" }
pubky-testnet.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }
