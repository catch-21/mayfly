[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/rules",
  "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/pubky/mayfly"

[workspace.dependencies]
# Pubky primitives: keys, BLAKE3, JWS helpers, Grant claims, capabilities.
# Path dependency on the sibling checkout while the SDK change in MAYFLY.md §16.3
# (GrantCredential::sign_jws) is developed; switch to a version once published.
pubky-common = { path = "../pubky-common" }
pubky = { path = "../pubky-sdk", default-features = false }
pubky-testnet = { path = "../pubky-testnet" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
base64 = "0.22"
base32 = "0.5"
proptest = "1"
tokio = "1.30"
