name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace depends on sibling checkouts of pubky-common, pubky-sdk and
      # pubky-testnet by path (README, "Layout"). Until the SDK change in §16.3 is published,
      # CI fetches the fork that carries it and places this repository inside it.
      - name: Fetch the pubky-homeserver checkout the path dependencies expect
        run: |
          git clone --depth 1 --branch catch-21/grant-jws-sign \
            https://github.com/catch-21/pubky-core.git "$RUNNER_TEMP/pubky-homeserver"
          rsync -a --exclude .git ./ "$RUNNER_TEMP/pubky-homeserver/mayfly/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/pubky-homeserver/mayfly
      - name: fmt
        run: cargo fmt --check
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly
      - name: test
        run: cargo test --workspace
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pubky-homeserver checkout the path dependencies expect
        run: |
          git clone --depth 1 --branch catch-21/grant-jws-sign \
            https://github.com/catch-21/pubky-core.git "$RUNNER_TEMP/pubky-homeserver"
          rsync -a --exclude .git ./ "$RUNNER_TEMP/pubky-homeserver/mayfly/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/pubky-homeserver/mayfly
      # Core, rules, the client (without the SDK feature) and the wasm module must stay
      # WASM-safe (§16.2.1 A, C).
      - name: clippy wasm32
        run: >
          cargo clippy -p pubky-mayfly -p pubky-mayfly-rules -p pubky-mayfly-client
          -p pubky-mayfly-wasm
          --no-default-features --target wasm32-unknown-unknown -- -D warnings
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the npm package and run its tests
        run: npm run build && npm test
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly/crates/wasm
      # The apps depend on the SDK's JS package by path; build it once (wasm-pack via npx).
      - name: build the SDK's JS package
        run: npx --yes --package wasm-pack -c 'cargo run --bin bundle_npm'
        working-directory: ${{ runner.temp }}/pubky-homeserver/pubky-sdk/bindings/js
      # The browser client sits between the wasm module and the apps; its tests run the loop
      # over a memory store in Node.
      - name: browser client
        run: npm install && npm run typecheck && npm test
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly/js/browser
      - name: list app
        run: npm install && npm run typecheck && npm run build && npm run build:testnet
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly/apps/list
      - name: viewer app
        run: npm install && npm run typecheck && npm run build && npm run build:testnet
        working-directory: ${{ runner.temp }}/pubky-homeserver/mayfly/apps/view
